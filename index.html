<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIKO AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #161b22;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #1f6feb;
            color: #ffffff;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        #user-input:focus {
            border-color: #58a6ff;
        }
        #send-btn {
            padding: 12px 20px;
            margin-right: 10px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <header>🤖 SAIKO AI - الشات الذكي</header>

    <div id="chat-container">
        <div class="message bot-message">مرحباً بك! أنا SAIKO AI. كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const apiKey = "AQ.Ab8RN6LK9Vua7b6rFiiEx1o4jJvCYq6LPjVX_73taAAd62EHMQ";
        const genAI = new GoogleGenerativeAI(apiKey);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        window.sendMessage = async function() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            appendMessage(messageText, 'user-message');
            inputField.value = '';

            const loadingMessage = appendMessage("جاري التفكير...", 'bot-message');

            try {
                const result = await model.generateContent(messageText);
                const response = await result.response;
                const text = response.text();
                
                if (text) {
                    loadingMessage.textContent = text;
                } else {
                    loadingMessage.textContent = "عذراً، لم أتمكن من إيجاد رد مناسب.";
                }
            } catch (error) {
                loadingMessage.textContent = "حدث خطأ: " + (error.message || "يرجى التحقق من المفتاح.");
            }
        };

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }
    </script>
</body>
</html>
