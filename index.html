<script>
    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatContainer = document.getElementById("chat-container");
        const messageText = inputField.value.trim();

        if (!messageText) return;

        // 1. إضافة رسالة المستخدم
        const userMsgDiv = document.createElement("div");
        userMsgDiv.className = "message user";
        userMsgDiv.innerText = messageText;
        chatContainer.appendChild(userMsgDiv);

        inputField.value = "";
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // 2. إضافة فقرة رد SAYKO AI
        const saykoMsgDiv = document.createElement("div");
        saykoMsgDiv.className = "message sayko";
        saykoMsgDiv.innerText = "جاري التفكير...";
        chatContainer.appendChild(saykoMsgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
            // استخدام رابط آمن ومباشر يعمل بدون حظر CORS
            const prompt = encodeURIComponent(`أنت SAYKO AI، مساعد ذكي ومباشر. أجب على السؤال التالي بوضوح وبصيغة قصيرة باللغة العربية: ${messageText}`);
            const apiUrl = `https://text.pollinations.ai/${prompt}?model=openai&cache=false`;

            const response = await fetch(apiUrl);

            if (!response.ok) throw new Error("Network response was not ok");

            const replyText = await response.text();
            
            // عرض الرد فوراً
            saykoMsgDiv.innerText = replyText.trim();

        } catch (error) {
            console.error("Error:", error);
            saykoMsgDiv.innerText = "عذراً، تعذر جلب الرد حالياً. يرجى إعادة المحاولة.";
        }

        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
</script>
