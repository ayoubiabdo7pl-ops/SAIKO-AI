<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIKO AI - Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #2563eb;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background-color: #334155;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 12px;
            background-color: #1e293b;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            outline: none;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>🤖 SAIKO AI Chat</header>

    <div id="chat-box">
        <div class="message bot-message">أهلاً بك! أنا SAIKO AI الذكاء الاصطناعي الخاص بك. كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        const API_KEY = "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";

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);

            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const botDiv = document.createElement("div");
            botDiv.className = "message bot-message";
            botDiv.textContent = "جاري التفكير...";
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [
                            { role: "system", content: "أنت ذكاء اصطناعي اسمك SAIKO AI (سايكو). أجب باحترافية وبشكل ذكي ومختصر وباللغة العربية." },
                            { role: "user", content: message }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0].message.content) {
                    botDiv.textContent = data.choices[0].message.content;
                } else {
                    botDiv.textContent = "عذراً، حدث خطأ أو أن مفتاح الـ API غير مفعل/منتهي الرصيد.";
                }
            } catch (error) {
                botDiv.textContent = "عذراً، تعذر الاتصال بالخادم حالياً.";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
