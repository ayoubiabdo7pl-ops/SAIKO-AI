<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIKO AI - Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 12px;
            line-height: 1.4;
        }
        .user-message {
            background-color: #2563eb;
            align-self: flex-start;
        }
        .bot-message {
            background-color: #334155;
            align-self: flex-end;
        }
        #input-container {
            display: flex;
            padding: 10px;
            background-color: #1e293b;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #0f172a;
            color: white;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>🤖 SAIKO AI Chat</header>

    <div id="chat-box">
        <div class="message bot-message">أهلاً بك! أنا SAIKO AI، كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            
            // إضافة رسالة المستخدم
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);

            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // رد مؤقت من البوت
            const botDiv = document.createElement("div");
            botDiv.className = "message bot-message";
            botDiv.textContent = "SAIKO AI قيد معالجة طلبك...";
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
