<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIKO AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; word-break: break-word; position: relative; line-height: 1.5; }
        .user { background-color: #0084ff; align-self: flex-end; }
        .bot { background-color: #262626; align-self: flex-start; border: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
        .audio-btn { background: none; border: 1px solid #0084ff; color: #0084ff; border-radius: 6px; cursor: pointer; font-size: 13px; padding: 4px 8px; align-self: flex-start; font-weight: bold; }
        #input-area { display: flex; padding: 10px; background-color: #1e1e1e; }
        input { flex: 1; padding: 12px; border: none; border-radius: 8px; background-color: #2a2a2a; color: #fff; outline: none; }
        button.send-btn { padding: 12px 20px; border: none; background-color: #0084ff; color: #fff; border-radius: 8px; margin-right: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-box">
        <div class="msg bot">
            <span>أهلاً بك! أنا SAIKO AI، الذكاء الاصطناعي الخاص بالمطور والتيكتوكر @ayko_1d. اسألني أي سؤال وسأجيبك فوراً!</span>
            <button class="audio-btn" onclick="speakText('أهلاً بك! أنا سايكو الذكاء الاصطناعي الخاص بالمطور والتيكتوكر ayko_1d. اسألني أي سؤال وسأجيبك فوراً!')">🔊 استماع</button>
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="اكتب سؤالك لـ SAIKO AI..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // ضع رابط الـ Worker الخاص بك هنا مكان الرابط المكتوب
        const WORKER_URL = "ضَع_رَابِط_الـWORKER_هُنَا";

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");

            // عرض رسالة المستخدم
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "msg user";
            userMsgDiv.innerText = message;
            chatBox.appendChild(userMsgDiv);

            inputField.value = "";

            // إظهار نص جاري التفكير
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "msg bot";
            loadingDiv.innerText = "جاري التفكير...";
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await res.json();
                const botReply = data.reply || "حدث خطأ أثناء الرد.";

                loadingDiv.innerHTML = "";
                const textSpan = document.createElement("span");
                textSpan.innerText = botReply;

                const soundBtn = document.createElement("button");
                soundBtn.className = "audio-btn";
                soundBtn.innerText = "🔊 استماع";
                soundBtn.onclick = () => speakText(botReply);

                loadingDiv.appendChild(textSpan);
                loadingDiv.appendChild(soundBtn);
            } catch (err) {
                loadingDiv.innerText = "تعذر الاتصال بالخادم الذكي.";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
