<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIKO AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-card { width: 100%; max-width: 480px; height: 90vh; background-color: #1e293b; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #334155; }
        .chat-header { background: linear-gradient(135deg, #2563eb, #1d4ed8); padding: 16px; text-align: center; font-size: 1.2rem; font-weight: bold; color: #ffffff; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .user-message { align-self: flex-end; background-color: #2563eb; color: #ffffff; border-bottom-left-radius: 2px; }
        .saiko-message { align-self: flex-start; background-color: #334155; color: #f8fafc; border-bottom-right-radius: 2px; }
        .chat-input-area { padding: 12px; background-color: #0f172a; display: flex; gap: 8px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #334155; background-color: #1e293b; color: #ffffff; outline: none; }
        button { padding: 12px 20px; border-radius: 24px; border: none; background-color: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <span>SAIKO AI 🤖</span>
        <span style="font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 12px;">صوتي 🔊</span>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message saiko-message">أهلاً بك! أنا سايكو (SAIKO AI)، كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك لسايكو..." onkeydown="if(event.key === 'Enter') sendMsg()">
        <button onclick="sendMsg()">إرسال</button>
    </div>
</div>

<script>
    const WORKER_URL = "https://aykotik.ayoubiabdo7-pl.workers.dev";

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            window.speechSynthesis.speak(utterance);
        }
    }

    async function sendMsg() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user-message');
        input.value = '';

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await res.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const saikoReply = data.candidates[0].content.parts[0].text;
                addMessage(saikoReply, 'saiko-message');
                speakText(saikoReply);
            } else if (data.error) {
                addMessage(`خطأ من جوجل: ${data.error.message || JSON.stringify(data.error)}`, 'saiko-message');
            } else {
                addMessage('استجابة غير معروفة من السيرفر.', 'saiko-message');
            }
        } catch (err) {
            addMessage('تعذر الاتصال بالسيرفر.', 'saiko-message');
        }
    }

    function addMessage(msg, className) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = msg;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
