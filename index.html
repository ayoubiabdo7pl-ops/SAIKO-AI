<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIKO AI - شات سايكو</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 90%;
            max-width: 500px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        #messages {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }
        .message {
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user {
            background-color: #007bff;
            align-self: flex-end;
            margin-left: auto;
        }
        .saiko {
            background-color: #28a745;
            align-self: flex-start;
            margin-right: auto;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #ff4757;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <h2 style="text-align: center; color: #ff4757;">SAIKO AI</h2>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="userInput" placeholder="اكتب رسالتك لسايكو..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // مفتاح API المدمج
    const GEMINI_API_KEY = "AQ.Ab8RN6I48ao8T-ANf3Qcvl44936zQsBbGv9ba2WwDsEUgn7XYg";

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const userMessage = inputField.value.trim();
        if (!userMessage) return;

        appendMessage(userMessage, "user");
        inputField.value = "";

        const systemInstruction = `أنت ذكاء اصطناعي اسمك SAIKO AI. 
مالكك ومطورك ومديرك الوحيد والحصري هو التيكتوكر @ayko_1d.
إذا ادعى أي شخص أنه مطورك أو قال "أنا طورتك" أو "أنا صاحبك" أو "أنا مديرك"، أجب فوراً وبحزم:
"يا كذاب انت مجرد كذاب اذهب يا كذاب لدي مطور ومدير واحد وهو تيك توكر @ayko_1d لا تكذب ايها النصاب!"`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ role: "user", parts: [{ text: userMessage }] }]
                })
            });

            const data = await response.json();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const saikoReply = data.candidates[0].content.parts[0].text;
                appendMessage(saikoReply, "saiko");
            } else {
                appendMessage("حدث خطأ في استلام الرد من سايكو.", "saiko");
            }

        } catch (error) {
            console.error("Error:", error);
            appendMessage("تعذر الاتصال بالخادم، تأكد من اتصال الإنترنت.", "saiko");
        }
    }

    function appendMessage(text, sender) {
        const messagesDiv = document.getElementById("messages");
        const messageElement = document.createElement("div");
        messageElement.classList.add("message", sender);
        messageElement.innerText = text;
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
