<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYKO AI CHAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 20px; }
        header { text-align: center; padding: 10px 0; border-bottom: 1px solid #334155; }
        header h1 { color: #38bdf8; font-size: 1.8rem; }
        #chat-container { flex: 1; overflow-y: auto; margin: 20px 0; padding: 10px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { background-color: #0284c7; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        .sayko { background-color: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-right-radius: 0; }
        .input-box { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-size: 1rem; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>SAYKO AI</h1>
    </header>

    <div id="chat-container">
        <div class="message sayko">مرحباً بك! أنا SAYKO AI، كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div class="input-box">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // 1. إضافة رسالة المستخدم إلى المحادثة
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user";
            userMsgDiv.innerText = messageText;
            chatContainer.appendChild(userMsgDiv);

            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. إنشاء عنصر لرد الذكاء الاصطناعي مع مؤشر انتظار
            const saykoMsgDiv = document.createElement("div");
            saykoMsgDiv.className = "message sayko";
            saykoMsgDiv.innerText = "جاري التفكير...";
            chatContainer.appendChild(saykoMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // إرسال الطلب إلى مزود مجاني يستجيب مباشرة عبر الـ Fetch بدون مفتاح مفروض
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "أنت SAYKO AI، مساعد ذكي ومباشر يجيب بوضوح وود ودقة باللغة العربية." },
                            { role: "user", content: messageText }
                        ],
                        model: "openai"
                    })
                });

                if (!response.ok) throw new Error("تعذر جلب الرد");

                const replyText = await response.text();
                
                // عرض الرد
                saykoMsgDiv.innerText = replyText;

            } catch (error) {
                console.error(error);
                saykoMsgDiv.innerText = "عذراً، حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
