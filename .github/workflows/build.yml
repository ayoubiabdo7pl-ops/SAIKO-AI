name: Build SAIKO AI APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3-pip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Initialize Buildozer spec if missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/^requirements = .*/requirements = python3,kivy,google-generativeai,arabic-reshaper,python-bidi/' buildozer.spec
            sed -i 's/^title = .*/title = SAIKO AI/' buildozer.spec
            sed -i 's/^package.name = .*/package.name = saikoai/' buildozer.spec
          fi

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAIKO-AI-APK
          path: bin/*.apk

